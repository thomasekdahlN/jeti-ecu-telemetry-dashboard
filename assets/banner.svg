<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="Jeti ECU Turbine Telemetry">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="0.55" stop-color="#1a1f4a"/>
      <stop offset="1" stop-color="#7a2a12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#ff8a3d" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffd2a8"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <clipPath id="round"><rect width="1280" height="340" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1280" height="340" fill="url(#bg)"/>
    <rect width="1280" height="340" fill="url(#glow)"/>
    <!-- faint grid -->
    <g stroke="#ffffff" stroke-opacity="0.05">
      <path d="M0 85H1280M0 170H1280M0 255H1280"/>
      <path d="M160 0V340M320 0V340M480 0V340M640 0V340M800 0V340M960 0V340M1120 0V340"/>
    </g>

    <!-- gauge -->
    <g transform="translate(1030 175)">
      <circle r="128" fill="#05080f" fill-opacity="0.55" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2"/>
      <path d="M-92 92A130 130 0 1 1 92 92" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="16" stroke-linecap="round" transform="scale(0.85)"/>
      <path d="M-92 92A130 130 0 1 1 78 -104" fill="none" stroke="url(#arc)" stroke-width="16" stroke-linecap="round" transform="scale(0.85)"/>
      <g stroke="#ffffff" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round">
        <path d="M-78 78L-68 68"/><path d="M-96 0L-84 0"/><path d="M-78 -78L-68 -68"/>
        <path d="M0 -96L0 -84"/><path d="M78 -78L68 -68"/><path d="M96 0L84 0"/><path d="M78 78L68 68"/>
      </g>
      <!-- turbine fan -->
      <g fill="#ffffff" fill-opacity="0.9">
        <path d="M0 0C-6 -22 -6 -44 0 -58C6 -44 6 -22 0 0Z"/>
        <path d="M0 0C-6 -22 -6 -44 0 -58C6 -44 6 -22 0 0Z" transform="rotate(60)"/>
        <path d="M0 0C-6 -22 -6 -44 0 -58C6 -44 6 -22 0 0Z" transform="rotate(120)"/>
        <path d="M0 0C-6 -22 -6 -44 0 -58C6 -44 6 -22 0 0Z" transform="rotate(180)"/>
        <path d="M0 0C-6 -22 -6 -44 0 -58C6 -44 6 -22 0 0Z" transform="rotate(240)"/>
        <path d="M0 0C-6 -22 -6 -44 0 -58C6 -44 6 -22 0 0Z" transform="rotate(300)"/>
      </g>
      <circle r="9" fill="#ff8a3d"/>
      <text y="108" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" fill-opacity="0.7" letter-spacing="3">RPM</text>
    </g>

    <!-- text -->
    <text x="64" y="40" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ff8a3d" letter-spacing="5">JETI LUA APP</text>
    <text x="64" y="124" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="68" font-weight="800" fill="url(#title)">ECU Turbine</text>
    <text x="64" y="196" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="68" font-weight="800" fill="url(#title)">Telemetry</text>
    <text x="64" y="242" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#cdd6f4">A silent cockpit for your turbine. Quiet until it matters.</text>

    <!-- chips -->
    <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff">
      <rect x="64" y="272" width="150" height="34" rx="17" fill="url(#chip)" stroke="#ffffff" stroke-opacity="0.2"/>
      <text x="139" y="294" text-anchor="middle">Lua 5.3</text>
      <rect x="228" y="272" width="210" height="34" rx="17" fill="url(#chip)" stroke="#ffffff" stroke-opacity="0.2"/>
      <text x="333" y="294" text-anchor="middle">20+ alarms in one app</text>
      <rect x="452" y="272" width="210" height="34" rx="17" fill="url(#chip)" stroke="#ffffff" stroke-opacity="0.2"/>
      <text x="557" y="294" text-anchor="middle">Jeti DC / DS radios</text>
    </g>
  </g>
</svg>
